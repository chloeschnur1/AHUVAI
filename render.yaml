# Render "Blueprint": creates the AHUVAI web service and its private database.
# In Render: New → Blueprint → choose this repository. See SETUP-GUIDE.md.
databases:
  - name: ahuvai-db
    databaseName: ahuvai
    plan: basic-256mb        # a paid plan: Render's free databases expire
    ipAllowList: []          # no access from the public internet

services:
  - type: web
    name: ahuvai
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ahuvai-db
          property: connectionString
      - key: DATABASE_SSL
        value: "off"         # Render's internal network; change to no-verify for an external database
      - key: DATA_ENCRYPTION_KEY
        generateValue: true  # COPY THIS VALUE TO A PASSWORD MANAGER — without it, profiles cannot be read
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: PUBLIC_URL
        sync: false          # e.g. https://portal.ahuvai.com
      - key: CONTACT_EMAIL
        sync: false
      - key: OWNER_NOTIFICATION_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
