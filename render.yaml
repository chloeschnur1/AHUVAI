# Render Blueprint: creates the AHUVAI website and its private database.
# In Render: New + > Blueprint > choose this repository. See SETUP-GUIDE.md.

databases:
  - name: ahuvai-db
    databaseName: ahuvai
    plan: basic-256mb

services:
  - type: web
    name: ahuvai
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ahuvai-db
          property: connectionString
      - key: DATABASE_SSL
        value: "off"
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
