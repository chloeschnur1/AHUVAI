<div class="auth-card" data-auth="reset">
  <span class="eyebrow center-block">Private Family Portal</span>
  <h1>Choose a new password</h1>
  <form data-reset-form novalidate>
    <div class="notice error" role="alert" data-form-error></div>
    <label class="field"><span class="label">New password</span><input class="input" type="password" name="password" autocomplete="new-password" required minlength="10">
      <span class="hint">At least 10 characters.</span></label>
    <button class="btn btn-primary" type="submit" data-submit>Save Password</button>
  </form>
  <div data-reset-done hidden><p class="lede">Your password has been updated.</p><a class="btn btn-primary" href="/portal">Sign In</a></div>
</div>
