<div class="auth-card" data-auth="login">
  <span class="eyebrow center-block">Private Family Portal</span>
  <h1>Welcome back</h1>
  <p class="lede">Sign in to view and complete your children's profiles.</p>
  <form data-login-form novalidate>
    <div class="notice error" role="alert" data-form-error></div>
    <label class="field"><span class="label">Email address</span><input class="input" type="email" name="email" autocomplete="username" required></label>
    <label class="field"><span class="label">Password</span><input class="input" type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit" data-submit>Sign In</button>
  </form>
  <details class="forgot">
    <summary>Forgotten your password?</summary>
    <form data-reset-request-form novalidate>
      <div class="notice" role="status" data-form-error></div>
      <label class="field"><span class="label">Email address</span><input class="input" type="email" name="email" autocomplete="email" required></label>
      <button class="btn btn-quiet" type="submit" data-submit>Send Reset Link</button>
    </form>
  </details>
  <p class="auth-links muted">The portal is available to families invited by AHUVAI.<br>New to AHUVAI? <a href="/begin">Begin your family experience</a>.</p>
</div>
